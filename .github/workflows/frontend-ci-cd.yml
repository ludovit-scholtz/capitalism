name: frontend-ci-cd

on:
  pull_request:
    paths:
      - 'projects/frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  PROJECT_PATH: projects/frontend
  IMAGE_NAME: harbor.de-4.biatec.io/biatec/capitalism-frontend
  K8S_NAMESPACE: capitalism
  K8S_DEPLOYMENT_NAME: capitalism-frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run test:unit

      - name: Build
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run build

      - name: Verify frontend security headers
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run test:security-headers

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_tag: ${{ steps.derive_image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive image tag
        id: derive_image_tag
        run: |
          set -euo pipefail
          image_tag="$(date -u +%F)-${GITHUB_SHA::8}-gf"
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.de-4.biatec.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.PROJECT_PATH }}
          file: ./${{ env.PROJECT_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.derive_image_tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    env:
      IMAGE_REF: harbor.de-4.biatec.io/biatec/capitalism-frontend:${{ needs.docker.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "Required secrets are not set. Skipping deployment."
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Apply namespace
        run: kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/namespace.yaml

      - name: Create or update image pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_REF}|g" ${{ env.PROJECT_PATH }}/deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/service.yaml
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/ingress.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} --namespace ${{ env.K8S_NAMESPACE }}

      - name: Refresh all shard frontend deployments
        env:
          TARGET_IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          get_master_web_url() {
            local namespace="$1"
            if [[ "$namespace" == capitalism-stage-* ]]; then
              printf '%s\n' 'https://www.stage.capitalism5.com'
              return 0
            fi
            printf '%s\n' 'https://www.capitalism5.com'
          }

          get_master_graphql_url() {
            local namespace="$1"
            if [[ "$namespace" == capitalism-stage-* ]]; then
              printf '%s\n' 'https://api.stage.capitalism5.com/graphql'
              return 0
            fi
            printf '%s\n' 'https://api.capitalism5.com/graphql'
          }

          get_deployment_env_value() {
            local namespace="$1"
            local deployment="$2"
            local env_name="$3"

            kubectl get deployment "$deployment" --namespace "$namespace" -o json | jq -r --arg env_name "$env_name" '
              [.spec.template.spec.containers[]?.env[]? | select(.name == $env_name) | .value][0] // empty
            '
          }

          derive_game_graphql_url() {
            local namespace="$1"
            local deployment="$2"
            local shard_slug

            if [[ "$deployment" != *-frontend ]]; then
              return 1
            fi

            shard_slug=${deployment%-frontend}
            if [ -z "$shard_slug" ]; then
              return 1
            fi

            if [[ "$namespace" == capitalism-stage-* ]]; then
              printf 'https://%s-api.stage.capitalism5.com/graphql\n' "$shard_slug"
              return 0
            fi

            if [[ "$namespace" == capitalism-production-* ]]; then
              printf 'https://%s-api.capitalism5.com/graphql\n' "$shard_slug"
              return 0
            fi

            return 1
          }

          set_game_frontend_runtime_env() {
            local namespace="$1"
            local deployment="$2"
            local master_web_url
            local master_graphql_url
            local existing_graphql_url
            local derived_graphql_url
            local game_graphql_url

            master_web_url=$(get_master_web_url "$namespace")
            master_graphql_url=$(get_master_graphql_url "$namespace")
            existing_graphql_url=$(get_deployment_env_value "$namespace" "$deployment" 'APP_GRAPHQL_URL')
            derived_graphql_url=$(derive_game_graphql_url "$namespace" "$deployment" || true)
            game_graphql_url=${derived_graphql_url:-$existing_graphql_url}

            if [ -z "$game_graphql_url" ]; then
              echo "Could not determine APP_GRAPHQL_URL for $namespace/$deployment. Existing runtime env is incomplete." >&2
              return 1
            fi

            kubectl set env "deployment/$deployment" \
              APP_GRAPHQL_URL="$game_graphql_url" \
              APP_MASTER_WEB_URL="$master_web_url" \
              APP_MASTER_GRAPHQL_URL="$master_graphql_url" \
              --namespace "$namespace"
          }

          resolve_container_name() {
            local namespace="$1"
            local deployment="$2"
            local preferred_container="$3"
            local image_repository="$4"
            local deployment_json
            local container_name
            local container_names
            local container_count

            deployment_json=$(kubectl get deployment "$deployment" --namespace "$namespace" -o json)
            container_name=$(printf '%s' "$deployment_json" | jq -r --arg image_repository "$image_repository" '
              [.spec.template.spec.containers[]? | select((.image | split(":")[0]) == $image_repository) | .name][0] // empty
            ')
            if [ -n "$container_name" ]; then
              printf '%s\n' "$container_name"
              return 0
            fi

            container_names=$(printf '%s' "$deployment_json" | jq -r '.spec.template.spec.containers[]?.name')
            container_count=$(printf '%s\n' "$container_names" | sed '/^$/d' | wc -l | tr -d ' ')

            if printf '%s\n' "$container_names" | grep -qx "$preferred_container"; then
              printf '%s\n' "$preferred_container"
              return 0
            fi

            if [ "$container_count" = "1" ]; then
              printf '%s\n' "$container_names" | sed -n '/./{p;q}'
              return 0
            fi

            if printf '%s\n' "$container_names" | grep -qx "$deployment"; then
              printf '%s\n' "$deployment"
              return 0
            fi

            echo "Could not resolve frontend container name for $namespace/$deployment." >&2
            printf '%s\n' "$container_names" >&2
            return 1
          }

          shard_namespaces=$(kubectl get namespace -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E '^capitalism-(stage|production)-' || true)

          if [ -z "$shard_namespaces" ]; then
            echo "No shard namespaces found."
            exit 0
          fi

          for namespace in $shard_namespaces; do
            deployments=$(kubectl get deployment -n "$namespace" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -- '-frontend$' || true)

            if [ -z "$deployments" ]; then
              echo "No shard frontend deployment found in namespace $namespace."
              continue
            fi

            for deployment in $deployments; do
              set_game_frontend_runtime_env "$namespace" "$deployment"

              container_name=$(resolve_container_name "$namespace" "$deployment" "game-frontend" "$TARGET_IMAGE_REPOSITORY")
              echo "Updating $namespace/$deployment ($container_name) to $IMAGE_REF"
              kubectl set image "deployment/$deployment" "$container_name=$IMAGE_REF" --namespace "$namespace"
              kubectl rollout status "deployment/$deployment" --namespace "$namespace" --timeout=900s
            done
          done
