name: frontend-ci-cd

on:
  pull_request:
    paths:
      - 'projects/frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  PROJECT_PATH: projects/frontend
  IMAGE_NAME: harbor.de-4.biatec.io/biatec/capitalism-frontend
  K8S_NAMESPACE: capitalism
  K8S_DEPLOYMENT_NAME: capitalism-frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run test:unit

      - name: Build
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run build

      - name: Verify frontend security headers
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run test:security-headers

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_tag: ${{ steps.derive_image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag
        id: derive_image_tag
        run: |
          set -euo pipefail
          image_tag="$(date -u +%F)-${GITHUB_SHA::8}-gf"
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.de-4.biatec.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.PROJECT_PATH }}
          file: ./${{ env.PROJECT_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.derive_image_tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    env:
      IMAGE_REF: harbor.de-4.biatec.io/biatec/capitalism-frontend:${{ needs.docker.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "Required secrets are not set. Skipping deployment."
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Apply namespace
        run: kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/namespace.yaml

      - name: Create or update image pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_REF}|g" ${{ env.PROJECT_PATH }}/deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/service.yaml
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/ingress.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} --namespace ${{ env.K8S_NAMESPACE }}

      - name: Refresh all stage shard frontend deployments
        run: |
          set -euo pipefail

          shard_namespaces=$(kubectl get namespace -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep '^capitalism-stage-' || true)

          if [ -z "$shard_namespaces" ]; then
            echo "No stage shard namespaces found."
            exit 0
          fi

          for namespace in $shard_namespaces; do
            deployments=$(kubectl get deployment -n "$namespace" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -- '-frontend$' || true)

            if [ -z "$deployments" ]; then
              echo "No shard frontend deployment found in namespace $namespace."
              continue
            fi

            for deployment in $deployments; do
              echo "Updating $namespace/$deployment to $IMAGE_REF"
              kubectl set image "deployment/$deployment" game-frontend="$IMAGE_REF" --namespace "$namespace"
              kubectl rollout status "deployment/$deployment" --namespace "$namespace" --timeout=900s
            done
          done
