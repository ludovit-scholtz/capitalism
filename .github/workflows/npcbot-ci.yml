name: npcbot-ci

on:
  pull_request:
    paths:
      - 'projects/NPCBot/**'
      - 'projects/NPCBot.Tests/**'
      - '.github/workflows/npcbot-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/NPCBot/**'
      - 'projects/NPCBot.Tests/**'
      - '.github/workflows/npcbot-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Restore
        run: |
          dotnet restore projects/NPCBot/NPCBot.csproj
          dotnet restore projects/NPCBot.Tests/NPCBot.Tests.csproj

      - name: Build NPCBot
        run: dotnet build projects/NPCBot/NPCBot.csproj --configuration Release --no-restore

      - name: Build NPCBot.Tests
        run: dotnet build projects/NPCBot.Tests/NPCBot.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test projects/NPCBot.Tests/NPCBot.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=npcbot-test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npcbot-test-results
          path: ./TestResults/*.trx
