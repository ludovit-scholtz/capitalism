name: provision-game-shard-k8s

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: Public game shard name (for slug generation)
        required: true
        type: string
      city:
        description: Primary city focus for the new shard
        required: true
        type: choice
        options:
          - Bratislava
          - Prague
          - Vienna
          - Berlin
          - Warsaw
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - stage
          - production
      server_region:
        description: Region label shown in the master registry
        required: true
        type: choice
        options:
          - eu-central
          - eu-west
          - us-east
      game_api_image_tag:
        description: Game API image tag to deploy, or latest to resolve the newest commit-tagged API image
        required: false
        default: latest
        type: string
      game_frontend_image_tag:
        description: Game frontend image tag to deploy, or latest to resolve the newest commit-tagged frontend image
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  derive:
    name: Derive shard identifiers
    runs-on: ubuntu-latest
    outputs:
      shard_slug: ${{ steps.derive.outputs.shard_slug }}
      k8s_slug: ${{ steps.derive.outputs.k8s_slug }}
      base_domain: ${{ steps.derive.outputs.base_domain }}
      frontend_host: ${{ steps.derive.outputs.frontend_host }}
      api_host: ${{ steps.derive.outputs.api_host }}
      master_graphql_url: ${{ steps.derive.outputs.master_graphql_url }}
      namespace: ${{ steps.derive.outputs.namespace }}
      db_name: ${{ steps.derive.outputs.db_name }}
      db_user: ${{ steps.derive.outputs.db_user }}
    steps:
      - name: Validate inputs and build slug
        id: derive
        run: |
          set -euo pipefail

          GAME_NAME='${{ github.event.inputs.game_name }}'
          TARGET_ENV='${{ github.event.inputs.environment }}'

          if [ -z "$GAME_NAME" ]; then
            echo "Input 'game_name' is required. Provide a public shard name such as 'Berlin 2026'." >&2
            exit 1
          fi

          normalized=$(printf '%s' "$GAME_NAME" \
            | iconv -c -t ascii//translit \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')

          if [ -z "$normalized" ]; then
            echo "Could not derive a valid slug from game_name='$GAME_NAME'. Use letters/numbers in game_name." >&2
            exit 1
          fi

          year=$(date -u +%Y)
          shard_slug="${normalized}-${year}"
          shard_slug=$(printf '%s' "$shard_slug" | sed -E 's/-+/-/g; s/^-+//; s/-+$//')

          if [ ${#shard_slug} -gt 48 ]; then
            shard_slug=$(printf '%s' "$shard_slug" | cut -c1-48 | sed -E 's/-+$//')
          fi

          if [ "$TARGET_ENV" = "production" ]; then
            base_domain='capitalism5.com'
          else
            base_domain='stage.capitalism5.com'
          fi

          k8s_slug=$(printf '%s' "$shard_slug" | cut -c1-30 | sed -E 's/-+$//')
          namespace="capitalism-${TARGET_ENV}-${k8s_slug}"
          db_name="game_${k8s_slug//-/_}"
          db_user="u_${k8s_slug//-/_}"

          frontend_host="${shard_slug}.${base_domain}"
          api_host="${shard_slug}-api.${base_domain}"
          master_graphql_url="https://api.${base_domain}/graphql"

          {
            echo "shard_slug=$shard_slug"
            echo "k8s_slug=$k8s_slug"
            echo "base_domain=$base_domain"
            echo "frontend_host=$frontend_host"
            echo "api_host=$api_host"
            echo "master_graphql_url=$master_graphql_url"
            echo "namespace=$namespace"
            echo "db_name=$db_name"
            echo "db_user=$db_user"
          } >> "$GITHUB_OUTPUT"

  provision:
    name: Provision shard on ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: derive
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: shard-provision-${{ github.event.inputs.environment }}-${{ needs.derive.outputs.shard_slug }}
      cancel-in-progress: false
    env:
      SHARD_SLUG: ${{ needs.derive.outputs.shard_slug }}
      K8S_SLUG: ${{ needs.derive.outputs.k8s_slug }}
      BASE_DOMAIN: ${{ needs.derive.outputs.base_domain }}
      FRONTEND_HOST: ${{ needs.derive.outputs.frontend_host }}
      API_HOST: ${{ needs.derive.outputs.api_host }}
      MASTER_GRAPHQL_URL: ${{ needs.derive.outputs.master_graphql_url }}
      K8S_NAMESPACE: ${{ needs.derive.outputs.namespace }}
      DB_NAME: ${{ needs.derive.outputs.db_name }}
      DB_USER: ${{ needs.derive.outputs.db_user }}
      GAME_NAME: ${{ github.event.inputs.game_name }}
      GAME_API_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-api
      GAME_FRONTEND_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-frontend
      CITY: ${{ github.event.inputs.city }}
      TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
      SERVER_REGION: ${{ github.event.inputs.server_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          KUBE_CONFIG_DATA_SECRET: ${{ secrets.KUBE_CONFIG_DATA }}
          HARBOR_USERNAME_SECRET: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD_SECRET: ${{ secrets.HARBOR_PASSWORD }}
          MASTER_REGISTRATION_KEY_SECRET: ${{ secrets.MASTER_REGISTRATION_KEY }}
          GAME_BOOTSTRAP_ADMIN_EMAIL_SECRET: ${{ secrets.GAME_BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          missing=0

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          }

          require_secret "KUBE_CONFIG_DATA" "$KUBE_CONFIG_DATA_SECRET"
          require_secret "HARBOR_USERNAME" "$HARBOR_USERNAME_SECRET"
          require_secret "HARBOR_PASSWORD" "$HARBOR_PASSWORD_SECRET"
          require_secret "MASTER_REGISTRATION_KEY" "$MASTER_REGISTRATION_KEY_SECRET"
          require_secret "GAME_BOOTSTRAP_ADMIN_EMAIL" "$GAME_BOOTSTRAP_ADMIN_EMAIL_SECRET"

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing in the '${TARGET_ENVIRONMENT}' environment. Configure secrets and re-run provisioning." >&2
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Resolve shard image tags
        id: resolve_image_tags
        env:
          HARBOR_API_BASE: https://harbor.de-4.biatec.io/api/v2.0
          HARBOR_PROJECT: biatec
          HARBOR_USERNAME_SECRET: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD_SECRET: ${{ secrets.HARBOR_PASSWORD }}
          REQUESTED_GAME_API_TAG: ${{ github.event.inputs.game_api_image_tag }}
          REQUESTED_GAME_FRONTEND_TAG: ${{ github.event.inputs.game_frontend_image_tag }}
        run: |
          set -euo pipefail

          validate_explicit_tag() {
            local tag="$1"
            local suffix="$2"

            if [[ ! "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}-[a-z]{2}$ ]]; then
              echo "Tag '$tag' must be a full commit-based tag such as 2026-05-16-deadbeef${suffix}." >&2
              exit 1
            fi

            if [[ "$tag" != *"$suffix" ]]; then
              echo "Tag '$tag' does not match expected suffix '$suffix'." >&2
              exit 1
            fi
          }

          resolve_latest_tag() {
            local repository="$1"
            local suffix="$2"
            local tag=""
            local page=1

            while [ -z "$tag" ] && [ "$page" -le 10 ]; do
              response=$(curl -fsS -u "$HARBOR_USERNAME_SECRET:$HARBOR_PASSWORD_SECRET" "${HARBOR_API_BASE}/projects/${HARBOR_PROJECT}/repositories/${repository}/artifacts?page=${page}&page_size=100&with_tag=true&sort=-push_time")
              tag=$(printf '%s' "$response" | jq -r --arg suffix "$suffix" '
                [.[] | .tags[]?.name | select(endswith($suffix) and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}"))][0] // empty
              ')
              page=$((page + 1))
            done

            if [ -z "$tag" ]; then
              echo "Could not resolve latest Harbor tag for repository '$repository' with suffix '$suffix'." >&2
              exit 1
            fi

            printf '%s\n' "$tag"
          }

          resolve_tag() {
            local repository="$1"
            local suffix="$2"
            local requested_tag="$3"

            if [ "$requested_tag" = "latest" ]; then
              resolve_latest_tag "$repository" "$suffix"
              return 0
            fi

            validate_explicit_tag "$requested_tag" "$suffix"
            printf '%s\n' "$requested_tag"
          }

          game_api_tag=$(resolve_tag "capitalism-api" "-ga" "$REQUESTED_GAME_API_TAG")
          game_frontend_tag=$(resolve_tag "capitalism-frontend" "-gf" "$REQUESTED_GAME_FRONTEND_TAG")

          {
            echo "game_api=$game_api_tag"
            echo "game_frontend=$game_frontend_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Generate unique shard credentials
        id: secrets
        run: |
          set -euo pipefail

          db_password=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 32)
          jwt_signing_key=$(openssl rand -base64 64 | tr -d '\n')
          shard_registration_key=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40)
          admin_password=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)

          printf '%s\n' "::add-mask::$db_password"
          printf '%s\n' "::add-mask::$jwt_signing_key"
          printf '%s\n' "::add-mask::$shard_registration_key"
          printf '%s\n' "::add-mask::$admin_password"
          printf '%s\n' "::add-mask::${{ secrets.GAME_BOOTSTRAP_ADMIN_EMAIL }}"

          {
            echo "db_password=$db_password"
            echo "jwt_signing_key=$jwt_signing_key"
            echo "shard_registration_key=$shard_registration_key"
            echo "admin_password=$admin_password"
          } >> "$GITHUB_OUTPUT"

      - name: Create namespace and registry secret
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry regcred \
            --namespace "$K8S_NAMESPACE" \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply shard secrets
        run: |
          set -euo pipefail
          connection_string="Host=${K8S_SLUG}-postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${{ steps.secrets.outputs.db_password }};SSL Mode=Disable"

          kubectl create secret generic shard-runtime-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DB_PASSWORD='${{ steps.secrets.outputs.db_password }}' \
            --from-literal=CONNECTION_STRING="$connection_string" \
            --from-literal=JWT_SIGNING_KEY='${{ steps.secrets.outputs.jwt_signing_key }}' \
            --from-literal=SHARD_REGISTRATION_KEY='${{ steps.secrets.outputs.shard_registration_key }}' \
            --from-literal=ADMIN_PASSWORD='${{ steps.secrets.outputs.admin_password }}' \
            --from-literal=MASTER_REGISTRATION_KEY='${{ secrets.MASTER_REGISTRATION_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL, game API, frontend and ingress
        id: deploy_rollout
        env:
          GAME_API_IMAGE_TAG: ${{ steps.resolve_image_tags.outputs.game_api }}
          GAME_FRONTEND_IMAGE_TAG: ${{ steps.resolve_image_tags.outputs.game_frontend }}
        run: |
          set -euo pipefail

          SHARD_DB_PV_NAME="${K8S_NAMESPACE}-${K8S_SLUG}-postgres-pv"
          SHARD_DB_PVC_NAME="${K8S_SLUG}-postgres-data"
          SHARD_DB_STORAGE_PATH="/mnt/capitalism/db-game-${SHARD_SLUG}"

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: ${SHARD_DB_PV_NAME}
          spec:
            capacity:
              storage: 10Gi
            accessModes:
              - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            storageClassName: manual
            hostPath:
              path: ${SHARD_DB_STORAGE_PATH}
              type: DirectoryOrCreate
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${SHARD_DB_PVC_NAME}
            namespace: ${K8S_NAMESPACE}
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: manual
            volumeName: ${SHARD_DB_PV_NAME}
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: ${K8S_SLUG}-postgres
            namespace: ${K8S_NAMESPACE}
          spec:
            serviceName: ${K8S_SLUG}-postgres
            replicas: 1
            selector:
              matchLabels:
                app: ${K8S_SLUG}-postgres
            template:
              metadata:
                labels:
                  app: ${K8S_SLUG}-postgres
              spec:
                volumes:
                  - name: postgres-data
                    persistentVolumeClaim:
                      claimName: ${SHARD_DB_PVC_NAME}
                containers:
                  - name: postgres
                    image: postgres:18
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        value: ${DB_NAME}
                      - name: POSTGRES_USER
                        value: ${DB_USER}
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: DB_PASSWORD
                    readinessProbe:
                      exec:
                        command:
                          - sh
                          - -c
                          - pg_isready -U ${DB_USER} -d ${DB_NAME}
                      periodSeconds: 10
                    volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${K8S_SLUG}-postgres
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: ${K8S_SLUG}-postgres
            ports:
              - name: postgres
                port: 5432
                targetPort: 5432
          EOF

          kubectl rollout status statefulset/${K8S_SLUG}-postgres --namespace "$K8S_NAMESPACE" --timeout=420s
          kubectl wait --for=condition=ready pod -l app=${K8S_SLUG}-postgres --namespace "$K8S_NAMESPACE" --timeout=420s
          shard_postgres_pod=$(kubectl get pod --namespace "$K8S_NAMESPACE" -l app=${K8S_SLUG}-postgres -o jsonpath='{.items[0].metadata.name}')
          until kubectl exec --namespace "$K8S_NAMESPACE" "$shard_postgres_pod" -- sh -lc 'PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" "$POSTGRES_DB" -c "select 1" >/dev/null'; do
            echo "Waiting for active SQL connection on ${K8S_SLUG}-postgres/${DB_NAME}..."
            sleep 5
          done

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${K8S_SLUG}-api
            namespace: ${K8S_NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${K8S_SLUG}-api
            template:
              metadata:
                labels:
                  app: ${K8S_SLUG}-api
              spec:
                imagePullSecrets:
                  - name: regcred
                initContainers:
                  - name: wait-for-shard-postgres
                    image: postgres:18
                    env:
                      - name: PGHOST
                        value: ${K8S_SLUG}-postgres
                      - name: PGPORT
                        value: "5432"
                      - name: PGDATABASE
                        value: ${DB_NAME}
                      - name: PGUSER
                        value: ${DB_USER}
                      - name: PGSSLMODE
                        value: disable
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: DB_PASSWORD
                    command:
                      - sh
                      - -c
                      - |
                        until psql -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null 2>&1; do
                            echo "Waiting for PostgreSQL connection to \${PGHOST}/\${PGDATABASE}..."
                          sleep 5
                        done
                containers:
                  - name: game-api
                    image: ${GAME_API_IMAGE_REPOSITORY}:${GAME_API_IMAGE_TAG}
                    ports:
                      - containerPort: 8080
                    env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: Production
                      - name: ConnectionStrings__GameCatalog
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: CONNECTION_STRING
                      - name: Cors__AllowedOrigins__0
                        value: https://${FRONTEND_HOST}
                      - name: Jwt__SigningKey
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: JWT_SIGNING_KEY
                      - name: SeedData__AdminEmail
                        value: '${{ secrets.GAME_BOOTSTRAP_ADMIN_EMAIL }}'
                      - name: SeedData__AdminPassword
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: ADMIN_PASSWORD
                      - name: MasterServer__RegistrationEnabled
                        value: "true"
                      - name: MasterServer__ApiUrl
                        value: ${MASTER_GRAPHQL_URL}
                      - name: MasterServer__RegistrationKey
                        valueFrom:
                          secretKeyRef:
                            name: shard-runtime-secrets
                            key: MASTER_REGISTRATION_KEY
                      - name: MasterServer__ServerKey
                        value: ${SHARD_SLUG}
                      - name: MasterServer__DisplayName
                        value: '${{ github.event.inputs.game_name }}'
                      - name: MasterServer__Description
                        value: ${TARGET_ENVIRONMENT} shard for ${{ github.event.inputs.city }}
                      - name: MasterServer__Region
                        value: ${SERVER_REGION}
                      - name: MasterServer__Environment
                        value: ${TARGET_ENVIRONMENT}
                      - name: MasterServer__BackendUrl
                        value: https://${API_HOST}
                      - name: MasterServer__GraphqlUrl
                        value: https://${API_HOST}/graphql
                      - name: MasterServer__FrontendUrl
                        value: https://${FRONTEND_HOST}
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 20
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${K8S_SLUG}-api
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: ${K8S_SLUG}-api
            ports:
              - name: http
                port: 80
                targetPort: 8080
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${K8S_SLUG}-frontend
            namespace: ${K8S_NAMESPACE}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${K8S_SLUG}-frontend
            template:
              metadata:
                labels:
                  app: ${K8S_SLUG}-frontend
              spec:
                imagePullSecrets:
                  - name: regcred
                containers:
                  - name: game-frontend
                    image: ${GAME_FRONTEND_IMAGE_REPOSITORY}:${GAME_FRONTEND_IMAGE_TAG}
                    ports:
                      - containerPort: 80
                    env:
                      - name: NODE_ENV
                        value: production
                      - name: APP_GRAPHQL_URL
                        value: https://${API_HOST}/graphql
                      - name: APP_BIATEC_OIDC_REDIRECT_URI
                        value: https://${FRONTEND_HOST}/auth/callback
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      initialDelaySeconds: 15
                      periodSeconds: 20
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${K8S_SLUG}-frontend
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: ${K8S_SLUG}-frontend
            ports:
              - name: http
                port: 80
                targetPort: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${K8S_SLUG}-api
            namespace: ${K8S_NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${API_HOST}
                secretName: ${K8S_SLUG}-api-tls
            rules:
              - host: ${API_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${K8S_SLUG}-api
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${K8S_SLUG}-frontend
            namespace: ${K8S_NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${FRONTEND_HOST}
                secretName: ${K8S_SLUG}-frontend-tls
            rules:
              - host: ${FRONTEND_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${K8S_SLUG}-frontend
                          port:
                            number: 80
          EOF

          kubectl rollout status deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE" --timeout=900s
          kubectl rollout status deployment/${K8S_SLUG}-frontend --namespace "$K8S_NAMESPACE" --timeout=900s

      - name: Smoke check shard readiness and registration
        id: smoke_check
        run: |
          set -euo pipefail

          api_ok=0
          frontend_ok=0
          for attempt in {1..40}; do
            api_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${API_HOST}/healthz" || true)
            frontend_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${FRONTEND_HOST}" || true)

            if [ "$api_code" = "200" ]; then
              api_ok=1
            fi
            if [ "$frontend_code" = "200" ]; then
              frontend_ok=1
            fi

            if [ "$api_ok" = "1" ] && [ "$frontend_ok" = "1" ]; then
              break
            fi

            sleep 10
          done

          if [ "$api_ok" != "1" ]; then
            echo "Shard API smoke check failed for https://${API_HOST}/healthz. Verify PostgreSQL connectivity and ConnectionStrings__GameCatalog secret." >&2
            exit 1
          fi

          if [ "$frontend_ok" != "1" ]; then
            echo "Shard frontend smoke check failed for https://${FRONTEND_HOST}. Verify ingress host and frontend deployment status." >&2
            exit 1
          fi

          graphql_payload='{"query":"query ShardReadiness { cities { id name } }"}'
          graph_response=$(curl -sS -X POST "https://${API_HOST}/graphql" -H 'content-type: application/json' --data "$graphql_payload")
          if ! echo "$graph_response" | jq -e '.data.cities | length > 0' >/dev/null 2>&1; then
            echo "Readiness check failed: shard GraphQL endpoint did not return city data. Check shard database migration/startup." >&2
            echo "Response: $graph_response" >&2
            exit 1
          fi

          registry_ok=0
          registry_query='{"query":"query GameServers { gameServers { serverKey frontendUrl isActive } }"}'
          for attempt in {1..30}; do
            registry_response=$(curl -sS -X POST "${MASTER_GRAPHQL_URL}" -H 'content-type: application/json' --data "$registry_query")
            if echo "$registry_response" | jq -e --arg key "$SHARD_SLUG" '.data.gameServers[]? | select(.serverKey == $key and .isActive == true)' >/dev/null 2>&1; then
              registry_ok=1
              break
            fi
            sleep 10
          done

          if [ "$registry_ok" != "1" ]; then
            echo "Registration check failed: shard '$SHARD_SLUG' is not active in master registry. Check MasterServer__ApiUrl and MasterServer__RegistrationKey configuration." >&2
            exit 1
          fi

      - name: Scale shard API to steady-state replicas
        run: |
          set -euo pipefail

          # Bring up the first API pod alone so database migrations and seeding only
          # gate a single cold-start replica, then scale out after the shard is healthy.
          current_replicas=$(kubectl get deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE" -o jsonpath='{.spec.replicas}')
          if [ "$current_replicas" = "2" ]; then
            echo "Shard API deployment is already at 2 replicas."
            exit 0
          fi

          kubectl scale deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE" --replicas=2
          kubectl rollout status deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE" --timeout=600s

      - name: Roll back shard deployment on smoke-check failure
        if: failure() && steps.deploy_rollout.outcome == 'success'
        run: |
          set +e
          kubectl rollout undo deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE"
          kubectl rollout undo deployment/${K8S_SLUG}-frontend --namespace "$K8S_NAMESPACE"
          kubectl rollout status deployment/${K8S_SLUG}-api --namespace "$K8S_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/${K8S_SLUG}-frontend --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Provisioning summary
        if: always()
        env:
          GAME_API_IMAGE_TAG: ${{ steps.resolve_image_tags.outputs.game_api }}
          GAME_FRONTEND_IMAGE_TAG: ${{ steps.resolve_image_tags.outputs.game_frontend }}
        run: |
          {
            echo "## Game shard provisioning summary"
            echo "- Environment: ${TARGET_ENVIRONMENT}"
            echo "- Game name: ${GAME_NAME}"
            echo "- Game city: ${CITY}"
            echo "- Server region: ${SERVER_REGION}"
            echo "- Shard slug: ${SHARD_SLUG}"
            echo "- Namespace: ${K8S_NAMESPACE}"
            echo "- Game API image tag: ${GAME_API_IMAGE_TAG}"
            echo "- Game frontend image tag: ${GAME_FRONTEND_IMAGE_TAG}"
            echo "- Frontend URL: https://${FRONTEND_HOST}"
            echo "- API URL: https://${API_HOST}"
          } >> "$GITHUB_STEP_SUMMARY"
