name: api-ci-cd

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: projects/Api
  IMAGE_NAME: harbor.de-4.biatec.io/biatec/capitalism-api
  K8S_NAMESPACE: capitalism
  K8S_DEPLOYMENT_NAME: capitalism-api
  SeedData__AdminPassword: TestSeedAdminPassword123!

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}/Api.slnx

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }}/Api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.PROJECT_PATH }}/Api.slnx --configuration Release --no-build

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_tag: ${{ steps.derive_image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive image tag
        id: derive_image_tag
        run: |
          set -euo pipefail
          image_tag="$(date -u +%F)-${GITHUB_SHA::8}-ga"
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.de-4.biatec.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./projects
          file: ./${{ env.PROJECT_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.derive_image_tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    env:
      IMAGE_REF: harbor.de-4.biatec.io/biatec/capitalism-api:${{ needs.docker.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check secrets
        id: check_secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ] || [ -z "${{ secrets.EVENTS_API_JWT_SIGNING_KEY }}" ] || [ -z "${{ secrets.EVENTS_API_ADMIN_PASSWORD }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Required deploy secrets are not set. Skipping deployment steps."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deployment skipped (missing secrets)
        if: steps.check_secrets.outputs.ready != 'true'
        run: echo "Deployment skipped because required secrets are not configured."

      - name: Setup kubectl
        if: steps.check_secrets.outputs.ready == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Apply namespace and storage
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/namespace.yaml
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/persistent-volume-claim.yaml

      - name: Create or update image pull secret
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          kubectl create secret docker-registry regcred \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update application secrets
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          kubectl create secret generic capitalism-api-secrets \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --from-literal=jwt-signing-key='${{ secrets.EVENTS_API_JWT_SIGNING_KEY }}' \
            --from-literal=admin-password='${{ secrets.EVENTS_API_ADMIN_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_REF}|g" ${{ env.PROJECT_PATH }}/deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/service.yaml
          kubectl apply -f ${{ env.PROJECT_PATH }}/deploy/k8s/ingress.yaml

      - name: Verify rollout
        if: steps.check_secrets.outputs.ready == 'true'
        run: kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} --namespace ${{ env.K8S_NAMESPACE }}

      - name: Refresh all shard API deployments
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          TARGET_IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          resolve_container_name() {
            local namespace="$1"
            local deployment="$2"
            local preferred_container="$3"
            local image_repository="$4"
            local deployment_json
            local container_name
            local container_names
            local container_count

            deployment_json=$(kubectl get deployment "$deployment" --namespace "$namespace" -o json)
            container_name=$(printf '%s' "$deployment_json" | jq -r --arg image_repository "$image_repository" '
              [.spec.template.spec.containers[]? | select((.image | split(":")[0]) == $image_repository) | .name][0] // empty
            ')
            if [ -n "$container_name" ]; then
              printf '%s\n' "$container_name"
              return 0
            fi

            container_names=$(printf '%s' "$deployment_json" | jq -r '.spec.template.spec.containers[]?.name')
            container_count=$(printf '%s\n' "$container_names" | sed '/^$/d' | wc -l | tr -d ' ')

            if printf '%s\n' "$container_names" | grep -qx "$preferred_container"; then
              printf '%s\n' "$preferred_container"
              return 0
            fi

            if [ "$container_count" = "1" ]; then
              printf '%s\n' "$container_names" | sed -n '/./{p;q}'
              return 0
            fi

            if printf '%s\n' "$container_names" | grep -qx "$deployment"; then
              printf '%s\n' "$deployment"
              return 0
            fi

            echo "Could not resolve API container name for $namespace/$deployment." >&2
            printf '%s\n' "$container_names" >&2
            return 1
          }

          shard_namespaces=$(kubectl get namespace -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E '^capitalism-(stage|production)-' || true)

          if [ -z "$shard_namespaces" ]; then
            echo "No shard namespaces found."
            exit 0
          fi

          for namespace in $shard_namespaces; do
            deployments=$(kubectl get deployment -n "$namespace" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -- '-api$' || true)

            if [ -z "$deployments" ]; then
              echo "No shard API deployment found in namespace $namespace."
              continue
            fi

            for deployment in $deployments; do
              container_name=$(resolve_container_name "$namespace" "$deployment" "game-api" "$TARGET_IMAGE_REPOSITORY")
              echo "Updating $namespace/$deployment ($container_name) to $IMAGE_REF"
              kubectl set image "deployment/$deployment" "$container_name=$IMAGE_REF" --namespace "$namespace"
              kubectl rollout status "deployment/$deployment" --namespace "$namespace" --timeout=900s
            done
          done
