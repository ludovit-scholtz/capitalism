name: refresh-deployed-images

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to refresh
        required: true
        type: choice
        options:
          - stage
          - production
      game_api_tag:
        description: Exact game API tag, or latest to resolve the newest commit-tagged image
        required: false
        default: latest
        type: string
      game_frontend_tag:
        description: Exact game frontend tag, or latest to resolve the newest commit-tagged image
        required: false
        default: latest
        type: string
      master_api_tag:
        description: Exact master API tag, or latest to resolve the newest commit-tagged image
        required: false
        default: latest
        type: string
      master_frontend_tag:
        description: Exact master frontend tag, or latest to resolve the newest commit-tagged image
        required: false
        default: latest
        type: string

permissions:
  contents: read

env:
  HARBOR_API_BASE: https://harbor.de-4.biatec.io/api/v2.0
  HARBOR_PROJECT: biatec
  GAME_API_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-api
  GAME_FRONTEND_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-frontend
  MASTER_API_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-master-api
  MASTER_FRONTEND_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-master-frontend

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    concurrency:
      group: refresh-deployed-images-${{ github.event.inputs.target_environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          KUBE_CONFIG_DATA_SECRET: ${{ secrets.KUBE_CONFIG_DATA }}
          HARBOR_USERNAME_SECRET: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD_SECRET: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          }

          require_secret "KUBE_CONFIG_DATA" "$KUBE_CONFIG_DATA_SECRET"
          require_secret "HARBOR_USERNAME" "$HARBOR_USERNAME_SECRET"
          require_secret "HARBOR_PASSWORD" "$HARBOR_PASSWORD_SECRET"

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Configure secrets and re-run the workflow." >&2
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Resolve image tags
        id: resolve_image_tags
        env:
          HARBOR_USERNAME_SECRET: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD_SECRET: ${{ secrets.HARBOR_PASSWORD }}
          REQUESTED_GAME_API_TAG: ${{ github.event.inputs.game_api_tag }}
          REQUESTED_GAME_FRONTEND_TAG: ${{ github.event.inputs.game_frontend_tag }}
          REQUESTED_MASTER_API_TAG: ${{ github.event.inputs.master_api_tag }}
          REQUESTED_MASTER_FRONTEND_TAG: ${{ github.event.inputs.master_frontend_tag }}
        run: |
          set -euo pipefail

          validate_explicit_tag() {
            local tag="$1"
            local suffix="$2"

            if [[ ! "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}-[a-z]{2}$ ]]; then
              echo "Tag '$tag' must be a full commit-based tag such as 2026-05-16-deadbeef${suffix}." >&2
              exit 1
            fi

            if [[ "$tag" != *"$suffix" ]]; then
              echo "Tag '$tag' does not match expected suffix '$suffix'." >&2
              exit 1
            fi
          }

          resolve_latest_tag() {
            local repository="$1"
            local suffix="$2"
            local tag=""
            local page=1

            while [ -z "$tag" ] && [ "$page" -le 10 ]; do
              response=$(curl -fsS -u "$HARBOR_USERNAME_SECRET:$HARBOR_PASSWORD_SECRET" "${HARBOR_API_BASE}/projects/${HARBOR_PROJECT}/repositories/${repository}/artifacts?page=${page}&page_size=100&with_tag=true&sort=-push_time")
              tag=$(printf '%s' "$response" | jq -r --arg suffix "$suffix" '
                [.[] | .tags[]?.name | select(endswith($suffix) and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}"))][0] // empty
              ')
              page=$((page + 1))
            done

            if [ -z "$tag" ]; then
              echo "Could not resolve latest Harbor tag for repository '$repository' with suffix '$suffix'." >&2
              exit 1
            fi

            printf '%s\n' "$tag"
          }

          resolve_tag() {
            local repository="$1"
            local suffix="$2"
            local requested_tag="$3"

            if [ "$requested_tag" = "latest" ]; then
              resolve_latest_tag "$repository" "$suffix"
              return 0
            fi

            validate_explicit_tag "$requested_tag" "$suffix"
            printf '%s\n' "$requested_tag"
          }

          game_api_tag=$(resolve_tag "capitalism-api" "-ga" "$REQUESTED_GAME_API_TAG")
          game_frontend_tag=$(resolve_tag "capitalism-frontend" "-gf" "$REQUESTED_GAME_FRONTEND_TAG")
          master_api_tag=$(resolve_tag "capitalism-master-api" "-ma" "$REQUESTED_MASTER_API_TAG")
          master_frontend_tag=$(resolve_tag "capitalism-master-frontend" "-mf" "$REQUESTED_MASTER_FRONTEND_TAG")

          {
            echo "game_api=$game_api_tag"
            echo "game_frontend=$game_frontend_tag"
            echo "master_api=$master_api_tag"
            echo "master_frontend=$master_frontend_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh deployments
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment }}
          GAME_API_IMAGE_REF: ${{ env.GAME_API_IMAGE_REPOSITORY }}:${{ steps.resolve_image_tags.outputs.game_api }}
          GAME_FRONTEND_IMAGE_REF: ${{ env.GAME_FRONTEND_IMAGE_REPOSITORY }}:${{ steps.resolve_image_tags.outputs.game_frontend }}
          MASTER_API_IMAGE_REF: ${{ env.MASTER_API_IMAGE_REPOSITORY }}:${{ steps.resolve_image_tags.outputs.master_api }}
          MASTER_FRONTEND_IMAGE_REF: ${{ env.MASTER_FRONTEND_IMAGE_REPOSITORY }}:${{ steps.resolve_image_tags.outputs.master_frontend }}
        run: |
          set -euo pipefail

          patch_named_deployment() {
            local namespace="$1"
            local deployment="$2"
            local container_name="$3"
            local image_ref="$4"

            if ! kubectl get deployment "$deployment" --namespace "$namespace" >/dev/null 2>&1; then
              echo "Skipping missing deployment $namespace/$deployment."
              return 0
            fi

            echo "Updating $namespace/$deployment ($container_name) to $image_ref"
            kubectl set image "deployment/$deployment" "$container_name=$image_ref" --namespace "$namespace"
            kubectl rollout status "deployment/$deployment" --namespace "$namespace" --timeout=900s
          }

          resolve_container_name() {
            local namespace="$1"
            local deployment="$2"
            local preferred_container="$3"
            local image_repository="$4"
            local deployment_json
            local container_name
            local container_names
            local container_count

            deployment_json=$(kubectl get deployment "$deployment" --namespace "$namespace" -o json)
            container_name=$(printf '%s' "$deployment_json" | jq -r --arg image_repository "$image_repository" '
              [.spec.template.spec.containers[]? | select((.image | split(":")[0]) == $image_repository) | .name][0] // empty
            ')
            if [ -n "$container_name" ]; then
              printf '%s\n' "$container_name"
              return 0
            fi

            container_names=$(printf '%s' "$deployment_json" | jq -r '.spec.template.spec.containers[]?.name')
            container_count=$(printf '%s\n' "$container_names" | sed '/^$/d' | wc -l | tr -d ' ')

            if printf '%s\n' "$container_names" | grep -qx "$preferred_container"; then
              printf '%s\n' "$preferred_container"
              return 0
            fi

            if [ "$container_count" = "1" ]; then
              printf '%s\n' "$container_names" | sed -n '/./{p;q}'
              return 0
            fi

            if printf '%s\n' "$container_names" | grep -qx "$deployment"; then
              printf '%s\n' "$deployment"
              return 0
            fi

            echo "Could not resolve container name for $namespace/$deployment." >&2
            printf '%s\n' "$container_names" >&2
            return 1
          }

          refresh_shard_deployments() {
            local namespace_regex="$1"
            local deployment_regex="$2"
            local preferred_container="$3"
            local image_repository="$4"
            local image_ref="$5"
            local friendly_name="$6"
            local shard_namespaces
            local deployments
            local container_name

            shard_namespaces=$(kubectl get namespace -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E "$namespace_regex" || true)

            if [ -z "$shard_namespaces" ]; then
              echo "No $friendly_name namespaces found for regex $namespace_regex."
              return 0
            fi

            for namespace in $shard_namespaces; do
              deployments=$(kubectl get deployment -n "$namespace" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E "$deployment_regex" || true)

              if [ -z "$deployments" ]; then
                echo "No deployments matching $deployment_regex found in namespace $namespace."
                continue
              fi

              for deployment in $deployments; do
                container_name=$(resolve_container_name "$namespace" "$deployment" "$preferred_container" "$image_repository")
                echo "Updating $namespace/$deployment ($container_name) to $image_ref"
                kubectl set image "deployment/$deployment" "$container_name=$image_ref" --namespace "$namespace"
                kubectl rollout status "deployment/$deployment" --namespace "$namespace" --timeout=900s
              done
            done
          }

          if [ "$TARGET_ENVIRONMENT" = "stage" ]; then
            patch_named_deployment "capitalism" "capitalism-api" "capitalism-api" "$GAME_API_IMAGE_REF"
            patch_named_deployment "capitalism" "capitalism-frontend" "capitalism-frontend" "$GAME_FRONTEND_IMAGE_REF"
            patch_named_deployment "capitalism-stage" "master-api" "master-api" "$MASTER_API_IMAGE_REF"
            patch_named_deployment "capitalism-stage" "master-frontend" "master-frontend" "$MASTER_FRONTEND_IMAGE_REF"
            refresh_shard_deployments '^capitalism-stage-' '-api$' 'game-api' "$GAME_API_IMAGE_REPOSITORY" "$GAME_API_IMAGE_REF" 'stage shard'
            refresh_shard_deployments '^capitalism-stage-' '-frontend$' 'game-frontend' "$GAME_FRONTEND_IMAGE_REPOSITORY" "$GAME_FRONTEND_IMAGE_REF" 'stage shard'
            exit 0
          fi

          patch_named_deployment "capitalism-production" "master-api" "master-api" "$MASTER_API_IMAGE_REF"
          patch_named_deployment "capitalism-production" "master-frontend" "master-frontend" "$MASTER_FRONTEND_IMAGE_REF"
          refresh_shard_deployments '^capitalism-production-' '-api$' 'game-api' "$GAME_API_IMAGE_REPOSITORY" "$GAME_API_IMAGE_REF" 'production shard'
          refresh_shard_deployments '^capitalism-production-' '-frontend$' 'game-frontend' "$GAME_FRONTEND_IMAGE_REPOSITORY" "$GAME_FRONTEND_IMAGE_REF" 'production shard'

      - name: Refresh summary
        if: always()
        run: |
          {
            echo "## Image refresh summary"
            echo "- Target environment: ${{ github.event.inputs.target_environment }}"
            echo "- Game API tag: ${{ steps.resolve_image_tags.outputs.game_api }}"
            echo "- Game frontend tag: ${{ steps.resolve_image_tags.outputs.game_frontend }}"
            echo "- Master API tag: ${{ steps.resolve_image_tags.outputs.master_api }}"
            echo "- Master frontend tag: ${{ steps.resolve_image_tags.outputs.master_frontend }}"
          } >> "$GITHUB_STEP_SUMMARY"