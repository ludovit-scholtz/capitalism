name: master-k8s-deploy-reusable

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment name (stage or production)
        required: true
        type: string
      namespace:
        description: Kubernetes namespace for master workloads
        required: true
        type: string
      frontend_host:
        description: Public hostname for master frontend
        required: true
        type: string
      api_host:
        description: Public hostname for master API
        required: true
        type: string
      redirect_host:
        description: Optional host redirected to frontend_host (e.g. capitalism5.com)
        required: false
        default: ''
        type: string
      image_tag:
        description: Container tag suffix (default github.sha)
        required: false
        default: ''
        type: string
    secrets:
      KUBE_CONFIG_DATA:
        required: true
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
      MASTER_DB_PASSWORD:
        required: true
      MASTER_JWT_SIGNING_KEY:
        required: true
      MASTER_REGISTRATION_KEY:
        required: true
      MASTER_ROOT_ADMIN_EMAIL:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy-master:
    name: Deploy master to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: master-k8s-${{ inputs.environment_name }}
      cancel-in-progress: false
    env:
      REGISTRY_REPOSITORY: harbor.de-4.biatec.io/biatec
      MASTER_API_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-master-api
      MASTER_FRONTEND_IMAGE_REPOSITORY: harbor.de-4.biatec.io/biatec/capitalism-master-frontend
      MASTER_DEPLOY_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
      K8S_NAMESPACE: ${{ inputs.namespace }}
      FRONTEND_HOST: ${{ inputs.frontend_host }}
      API_HOST: ${{ inputs.api_host }}
      REDIRECT_HOST: ${{ inputs.redirect_host }}
      MASTER_DB_HOST: master-postgres
      MASTER_DB_NAME: gamemaster
      MASTER_DB_USER: masterapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment inputs
        run: |
          set -euo pipefail
          if [ -z "$FRONTEND_HOST" ] || [ -z "$API_HOST" ]; then
            echo "Master hostnames are missing. Check workflow inputs frontend_host/api_host." >&2
            exit 1
          fi
          if [ -z "$K8S_NAMESPACE" ]; then
            echo "Kubernetes namespace is missing. Check workflow input namespace." >&2
            exit 1
          fi

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: harbor.de-4.biatec.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push master API image
        uses: docker/build-push-action@v6
        with:
          context: ./projects
          file: ./projects/MasterApi/Dockerfile
          push: true
          tags: |
            ${{ env.MASTER_API_IMAGE_REPOSITORY }}:${{ env.MASTER_DEPLOY_TAG }}
            ${{ env.MASTER_API_IMAGE_REPOSITORY }}:${{ inputs.environment_name }}-latest

      - name: Build and push master frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./projects/master-frontend
          file: ./projects/master-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.MASTER_FRONTEND_IMAGE_REPOSITORY }}:${{ env.MASTER_DEPLOY_TAG }}
            ${{ env.MASTER_FRONTEND_IMAGE_REPOSITORY }}:${{ inputs.environment_name }}-latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Create namespace and image pull secret
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry regcred \
            --namespace "$K8S_NAMESPACE" \
            --docker-server=harbor.de-4.biatec.io \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply runtime config and secrets
        run: |
          set -euo pipefail
          printf '%s\n' "::add-mask::${{ secrets.MASTER_ROOT_ADMIN_EMAIL }}"
          connection_string="Host=${MASTER_DB_HOST};Port=5432;Database=${MASTER_DB_NAME};Username=${MASTER_DB_USER};Password=${{ secrets.MASTER_DB_PASSWORD }};SSL Mode=Disable"

          kubectl create configmap master-runtime-config \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=MasterFrontendHost="$FRONTEND_HOST" \
            --from-literal=MasterApiHost="$API_HOST" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic master-runtime-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=ConnectionStrings__MasterCatalog="$connection_string" \
            --from-literal=MasterDb__Password='${{ secrets.MASTER_DB_PASSWORD }}' \
            --from-literal=Jwt__SigningKey='${{ secrets.MASTER_JWT_SIGNING_KEY }}' \
            --from-literal=MasterServer__RegistrationKey='${{ secrets.MASTER_REGISTRATION_KEY }}' \
            --from-literal=GameAdministration__RootAdministratorEmails__0='${{ secrets.MASTER_ROOT_ADMIN_EMAIL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy master PostgreSQL, API, frontend and ingress
        id: deploy_rollout
        run: |
          set -euo pipefail

          SECOND_CORS_HOST="$FRONTEND_HOST"
          if [ -n "$REDIRECT_HOST" ]; then
            SECOND_CORS_HOST="$REDIRECT_HOST"
          fi
          # Keep a deterministic second CORS slot so the generated deployment env structure
          # stays stable across stage/production and redirect-host toggles.
          # When redirect host is unset, the second slot intentionally duplicates frontend host;
          # duplicates are harmless and preserve env key numbering consistency.

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: ${MASTER_DB_HOST}
            namespace: ${K8S_NAMESPACE}
          spec:
            serviceName: ${MASTER_DB_HOST}
            replicas: 1
            selector:
              matchLabels:
                app: ${MASTER_DB_HOST}
            template:
              metadata:
                labels:
                  app: ${MASTER_DB_HOST}
              spec:
                containers:
                  - name: postgres
                    image: postgres:18
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        value: ${MASTER_DB_NAME}
                      - name: POSTGRES_USER
                        value: ${MASTER_DB_USER}
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: master-runtime-secrets
                            key: MasterDb__Password
                    readinessProbe:
                      exec:
                        command:
                          - sh
                          - -c
                          - pg_isready -U ${MASTER_DB_USER} -d ${MASTER_DB_NAME}
                      periodSeconds: 10
                    volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
            volumeClaimTemplates:
              - metadata:
                  name: postgres-data
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${MASTER_DB_HOST}
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: ${MASTER_DB_HOST}
            ports:
              - name: postgres
                port: 5432
                targetPort: 5432
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: master-api
            namespace: ${K8S_NAMESPACE}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: master-api
            template:
              metadata:
                labels:
                  app: master-api
              spec:
                imagePullSecrets:
                  - name: regcred
                containers:
                  - name: master-api
                    image: ${MASTER_API_IMAGE_REPOSITORY}:${MASTER_DEPLOY_TAG}
                    ports:
                      - containerPort: 8080
                    env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: Production
                      - name: Cors__AllowedOrigins__0
                        value: https://${FRONTEND_HOST}
                      - name: Cors__AllowedOrigins__1
                        value: https://${SECOND_CORS_HOST}
                      - name: ConnectionStrings__MasterCatalog
                        valueFrom:
                          secretKeyRef:
                            name: master-runtime-secrets
                            key: ConnectionStrings__MasterCatalog
                      - name: Jwt__SigningKey
                        valueFrom:
                          secretKeyRef:
                            name: master-runtime-secrets
                            key: Jwt__SigningKey
                      - name: MasterServer__RegistrationKey
                        valueFrom:
                          secretKeyRef:
                            name: master-runtime-secrets
                            key: MasterServer__RegistrationKey
                      - name: GameAdministration__RootAdministratorEmails__0
                        valueFrom:
                          secretKeyRef:
                            name: master-runtime-secrets
                            key: GameAdministration__RootAdministratorEmails__0
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 20
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: master-api
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: master-api
            ports:
              - name: http
                port: 80
                targetPort: 8080
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: master-frontend
            namespace: ${K8S_NAMESPACE}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: master-frontend
            template:
              metadata:
                labels:
                  app: master-frontend
              spec:
                imagePullSecrets:
                  - name: regcred
                containers:
                  - name: master-frontend
                    image: ${MASTER_FRONTEND_IMAGE_REPOSITORY}:${MASTER_DEPLOY_TAG}
                    ports:
                      - containerPort: 80
                    env:
                      - name: NODE_ENV
                        value: production
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      initialDelaySeconds: 15
                      periodSeconds: 20
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: master-frontend
            namespace: ${K8S_NAMESPACE}
          spec:
            selector:
              app: master-frontend
            ports:
              - name: http
                port: 80
                targetPort: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: master-api
            namespace: ${K8S_NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${API_HOST}
                secretName: master-api-tls
            rules:
              - host: ${API_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: master-api
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: master-frontend
            namespace: ${K8S_NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${FRONTEND_HOST}
                secretName: master-frontend-tls
            rules:
              - host: ${FRONTEND_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: master-frontend
                          port:
                            number: 80
          EOF

          if [ -n "$REDIRECT_HOST" ]; then
            printf '%s\n' \
              'apiVersion: networking.k8s.io/v1' \
              'kind: Ingress' \
              'metadata:' \
              '  name: master-frontend-redirect' \
              "  namespace: ${K8S_NAMESPACE}" \
              '  annotations:' \
              '    cert-manager.io/cluster-issuer: letsencrypt-dns' \
              "    nginx.ingress.kubernetes.io/permanent-redirect: https://${FRONTEND_HOST}\$request_uri" \
              'spec:' \
              '  ingressClassName: nginx' \
              '  tls:' \
              '    - hosts:' \
              "        - ${REDIRECT_HOST}" \
              '      secretName: master-redirect-tls' \
              '  rules:' \
              "    - host: ${REDIRECT_HOST}" \
              '      http:' \
              '        paths:' \
              '          - path: /' \
              '            pathType: Prefix' \
              '            backend:' \
              '              service:' \
              '                name: master-frontend' \
              '                port:' \
              '                  number: 80' \
              | kubectl apply -f -
          fi

          kubectl rollout status statefulset/${MASTER_DB_HOST} --namespace "$K8S_NAMESPACE" --timeout=420s
          kubectl rollout status deployment/master-api --namespace "$K8S_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/master-frontend --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Smoke check deployed endpoints
        id: smoke_check
        run: |
          set -euo pipefail

          frontend_ok=0
          api_ok=0
          for attempt in {1..30}; do
            frontend_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${FRONTEND_HOST}" || true)
            api_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${API_HOST}/healthz" || true)

            if [ "$frontend_code" = "200" ]; then
              frontend_ok=1
            fi
            if [ "$api_code" = "200" ]; then
              api_ok=1
            fi

            if [ "$frontend_ok" = "1" ] && [ "$api_ok" = "1" ]; then
              break
            fi

            sleep 10
          done

          if [ "$frontend_ok" != "1" ]; then
            echo "Smoke check failed: https://${FRONTEND_HOST} did not return HTTP 200. Check ingress host and frontend rollout." >&2
            exit 1
          fi

          if [ "$api_ok" != "1" ]; then
            echo "Smoke check failed: https://${API_HOST}/healthz did not return HTTP 200. Check database rollout and API deployment." >&2
            exit 1
          fi

      - name: Roll back on smoke-check failure
        if: failure() && steps.deploy_rollout.outcome == 'success'
        run: |
          set +e
          kubectl rollout undo deployment/master-api --namespace "$K8S_NAMESPACE"
          kubectl rollout undo deployment/master-frontend --namespace "$K8S_NAMESPACE"
          kubectl rollout status deployment/master-api --namespace "$K8S_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/master-frontend --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Master deployment summary"
            echo "- Environment: \`${{ inputs.environment_name }}\`"
            echo "- Namespace: \`${K8S_NAMESPACE}\`"
            echo "- Image tag: \`${MASTER_DEPLOY_TAG}\`"
            echo "- Frontend host: https://${FRONTEND_HOST}"
            echo "- API host: https://${API_HOST}"
            if [ -n "$REDIRECT_HOST" ]; then
              echo "- Canonical redirect source: https://${REDIRECT_HOST}"
            fi
            echo "- Master DB service: \`${MASTER_DB_HOST}:5432\`"
          } >> "$GITHUB_STEP_SUMMARY"
