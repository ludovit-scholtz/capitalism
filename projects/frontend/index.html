<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0047FF" />
    <title>Capitalism 5 - Online Business Simulation Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <!-- Prevent flash of wrong theme: apply stored preference before Vue hydrates.
         The game is dark-first; system prefers-color-scheme is intentionally ignored
         so headless CI and new players always start in dark mode.
         Only an explicit 'light' value in localStorage switches to light. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('app_theme')
          var theme = stored === 'light' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
