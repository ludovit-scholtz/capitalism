<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;color:#162033;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(31,45,61,.12);">
          <tr>
            <td style="background:linear-gradient(135deg,#102a43,#0f766e);padding:30px 34px;color:#ffffff;">
              <div style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.78;">Capitalism</div>
              <h1 style="margin:10px 0 0;font-size:28px;line-height:1.25;font-weight:700;">{{headline}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 34px;font-size:16px;line-height:1.65;color:#25364d;">
              {{{bodyHtml}}}
            </td>
          </tr>
          <tr>
            <td style="padding:22px 34px;background:#eef5f4;color:#526173;font-size:13px;line-height:1.5;">
              {{footerText}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
